# Google Jules Orchestrator Kit Config (v0.41.1)
version: 1
provider: jules
tier: pro
base_branch: main
branch_prefix: agent/

limits:
  concurrency: 8
  daily_tasks: 100
  stagger_ms: 1500
  diff_kb: 75

verify:
  test: "./scripts/test.sh"
  build: "./scripts/build.sh"
  lint: "cd hydragrow-frontend && npm run lint"
  typecheck: "cd hydragrow-frontend && npx tsc --noEmit"

presets:
  - nightly-security-audit
  - flaky-test-quarantine
  - doc-sync-sentinel
