[package]
edition = "2021"
rust-version = "1.95"
name = "zellij"
version = "0.45.1"
authors = ["Aram Drevekenin <aram@poor.dev>"]
build = "src/build.rs"
include = [
    "src/**/*",
    "assets/layouts/*",
    "assets/config/*",
    "LICENSE.md",
    "README.md",
    "!**/*_test.*",
    "!**/tests/**/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A terminal workspace with batteries included"
homepage = "https://zellij.dev"
readme = "README.md"
license = "MIT"
repository = "https://github.com/zellij-org/zellij"

[package.metadata.deb]
depends = "$auto"
license-file = [
    "LICENSE.md",
    "4",
]
assets = [
    [
    "target/release/zellij",
    "usr/bin/zellij",
    "755",
],
    [
    "GOVERNANCE.md",
    "usr/share/doc/zellij/GOVERNANCE.md",
    "644",
],
    [
    "README.md",
    "usr/share/doc/zellij/README.md",
    "644",
],
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[features]
default = [
    "plugins_from_target",
    "vendored_curl",
    "web_server_capability",
]
disable_automatic_asset_installation = ["zellij-utils/disable_automatic_asset_installation"]
plugins_from_target = ["zellij-utils/plugins_from_target"]
unstable = [
    "zellij-client/unstable",
    "zellij-utils/unstable",
]
vendored_curl = ["zellij-utils/vendored_curl"]
web_server_capability = [
    "zellij-client/web_server_capability",
    "zellij-server/web_server_capability",
    "zellij-utils/web_server_capability",
]

[[bin]]
name = "zellij"
path = "src/main.rs"

[dependencies.anyhow]
version = "1.0.70"
features = [
    "backtrace",
    "std",
]
default-features = false

[dependencies.clap]
version = "4.6"
features = [
    "std",
    "color",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "wrap_help",
    "derive",
    "env",
]
default-features = false

[dependencies.dialoguer]
version = "0.11"
features = [
    "password",
    "completion",
]
default-features = false

[dependencies.humantime]
version = "2.1.0"
default-features = false

[dependencies.interprocess]
version = "2.2"
features = ["tokio"]
default-features = false

[dependencies.isahc]
version = "1.7.2"
features = [
    "http2",
    "text-decoding",
]
default-features = false

[dependencies.log]
version = "0.4.17"
default-features = false

[dependencies.miette]
version = "7.6"
features = [
    "derive",
    "fancy",
]
default-features = false

[dependencies.names]
version = "0.14.0"
default-features = false

[dependencies.suggest]
version = "0.5.1"
default-features = false

[dependencies.thiserror]
version = "2.0.18"
features = ["std"]
default-features = false

[dependencies.zellij-client]
version = "0.45.1"

[dependencies.zellij-server]
version = "0.45.1"

[dependencies.zellij-utils]
version = "0.45.1"

[dev-dependencies.insta]
version = "1.48"

[dev-dependencies.rand]
version = "0.10.2"
features = [
    "std",
    "std_rng",
    "thread_rng",
]
default-features = false

[dev-dependencies.regex]
version = "1.5.5"
features = [
    "perf",
    "std",
    "unicode-perl",
]
default-features = false

[dev-dependencies.ssh2]
version = "0.9.1"

[dev-dependencies.vte]
version = "0.15"
features = ["std"]
default-features = false

[target."cfg(windows)".build-dependencies.embed-resource]
version = "3"

[profile.dev]
debug = "line-tables-only"

[profile.dev-opt]
inherits = "dev"

[profile.dev-opt.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
