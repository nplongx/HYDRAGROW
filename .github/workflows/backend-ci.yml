name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'hydragrow-backend/**'
      - 'hydragrow-shared/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'hydragrow-backend/**'
      - 'hydragrow-shared/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hydragrow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hydragrow_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hydragrow_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            hydragrow-backend
            hydragrow-shared

      - name: Check hydragrow-shared
        working-directory: hydragrow-shared
        run: cargo check

      - name: Check hydragrow-backend
        working-directory: hydragrow-backend
        run: cargo check

      - name: Test hydragrow-backend
        working-directory: hydragrow-backend
        run: cargo test

      - name: Clippy hydragrow-backend
        working-directory: hydragrow-backend
        run: cargo clippy

  post-deploy-healthcheck:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deploy
        run: sleep 90

      - name: Healthcheck
        run: |
          curl -sf https://hydragrow.onrender.com/metrics || exit 1
