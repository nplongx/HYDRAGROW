name: delivery-governance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: Delivery governance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required governance artifacts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          required=(
            "docs/DELIVERY-GOVERNANCE.md"
            "docs/project-state/CURRENT-STATUS.md"
            "docs/project-state/TRACEABILITY.md"
          )

          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required governance artifact: $file"; exit 1; }
          done

          echo "Governance artifacts present."

      - name: Validate PR contract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/validate_pr_contract.py

      - name: Detect material changes requiring project-state sync
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")
          echo "$changed"

          if grep -Eq '^(hydragrow-(backend|shared|frontend|controller-core|simulator|firmware)|\.github/workflows/)' <<< "$changed"; then
            missing=()
            grep -Fq 'docs/project-state/TRACEABILITY.md' <<< "$changed" || missing+=("docs/project-state/TRACEABILITY.md")
            grep -Fq 'docs/project-state/CURRENT-STATUS.md' <<< "$changed" || missing+=("docs/project-state/CURRENT-STATUS.md")

            if [ "${#missing[@]}" -gt 0 ]; then
              echo "Material system change detected but the following were not updated in this PR:"
              printf ' - %s\n' "${missing[@]}"
              echo "If this change truly has no requirement/state impact, document that explicitly in the PR's ## Documentation section and update these files accordingly."
              exit 1
            fi
          fi

      - name: Report gate
        run: |
          echo "Delivery governance gate passed."
          echo "Code correctness remains the responsibility of the existing CI/Jules review."
          echo "This gate verifies the delivery contract and project knowledge artifacts."