name: firmware-controller-ci

on:
  push:
    branches: [main]
    paths:
      - 'ESP32-C3-CONTROLLER-NODE/**'
      - '.github/workflows/firmware-controller-ci.yml'
  pull_request:
    paths:
      - 'ESP32-C3-CONTROLLER-NODE/**'
      - '.github/workflows/firmware-controller-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly + esp-rs toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          curl -L https://github.com/esp-rs/espup/releases/latest/download/espup-x86_64-unknown-linux-gnu -o espup
          chmod +x espup

          # Cài đặt target ESP32-C3
          ./espup install --targets esp32c3

          # Đảm bảo rust-src được cài đặt cho nightly
          rustup component add rust-src

          # Load các biến môi trường của toolchain ESP
          source "$HOME/export-esp.sh"

          echo "=== Rust ==="
          rustc --version
          cargo --version

          echo "=== Installed targets ==="
          rustup target list --installed

          echo "=== Installed components ==="
          rustup component list | grep -E 'rust-src|rustc|cargo' || true

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ESP32-C3-CONTROLLER-NODE
          cache-targets: true

      - name: cargo check (ESP32-C3 target)
        working-directory: ESP32-C3-CONTROLLER-NODE
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/export-esp.sh"

          # Chạy check với nightly theo cấu hình dự án
          cargo check --locked
