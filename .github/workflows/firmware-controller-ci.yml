name: firmware-controller-ci

on:
  push:
    branches: [main]
    paths:
      - 'ESP32-C3-CONTROLLER-NODE/**'
      - '.github/workflows/firmware-controller-ci.yml'
  pull_request:
    paths:
      - 'ESP32-C3-CONTROLLER-NODE/**'
      - '.github/workflows/firmware-controller-ci.yml'

jobs:
  build:
    # NOTE: this workflow intentionally has no `cargo test` step. The
    # esp32-c3-mist-weaver-os binary crate targets ESP32-C3 with
    # `harness = false` (see ESP32-C3-CONTROLLER-NODE/Cargo.toml) and links
    # esp-idf-sys, so `cargo test` cannot run on a standard GitHub Actions
    # host runner. All pure logic that used to live only in this crate
    # (MQTT command HMAC verification, health-loop publish-topic routing,
    # osaka pump soft-start generation tracking, safety-override read-site)
    # has been extracted into hydragrow-controller-core, which IS
    # host-testable — see controller-core-ci.yml's `cargo test` step. If you
    # add new logic to this crate that has no test coverage anywhere, ask
    # whether it can be extracted into hydragrow-controller-core instead of
    # adding it here untested.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: cargo check
            run: cargo check --locked
          - name: cargo fmt --check
            run: cargo fmt --check
          - name: cargo clippy
            run: cargo clippy --all-targets --all-features -- -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly + esp-rs toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          curl -L https://github.com/esp-rs/espup/releases/latest/download/espup-x86_64-unknown-linux-gnu -o espup
          chmod +x espup

          ./espup install --targets esp32c3
          source "$HOME/export-esp.sh"
          (cd ESP32-C3-CONTROLLER-NODE && rustup component add rust-src rustfmt clippy)

          echo "=== Rust ==="
          rustc --version
          cargo --version

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ESP32-C3-CONTROLLER-NODE
          cache-targets: true

      - name: ${{ matrix.check.name }}
        working-directory: ESP32-C3-CONTROLLER-NODE
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/export-esp.sh"
          ${{ matrix.check.run }}
