name: Frontend CI

on:
  push:
    paths:
      - 'hydragrow-frontend/**'
  pull_request:
    paths:
      - 'hydragrow-frontend/**'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd hydragrow-frontend && npm ci
      - name: Type check
        run: cd hydragrow-frontend && npx tsc --noEmit
      - name: Lint
        run: cd hydragrow-frontend && npx eslint .
      - name: Run tests
        run: cd hydragrow-frontend && npx vitest run
