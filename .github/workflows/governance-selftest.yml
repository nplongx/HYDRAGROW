name: governance-selftest

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    name: Governance evaluator self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic evaluator self-test
        run: python3 .github/scripts/governance_selftest.py
