name: jules-audit-reconciler

# Poll completed Jules audit sessions, extract findings, and dispatch fixes.
# Jules concurrency is globally limited to prevent task explosion.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional audit issue number"
        required: false
        type: string
      session_id:
        description: "Optional Jules session ID"
        required: false
        type: string

permissions:
  issues: write
  contents: read

concurrency:
  group: jules-audit-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install juleson
        run: |
          curl -fsSL https://github.com/SamyRai/Juleson/releases/latest/download/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate parser contract
        run: |
          python3 - <<'PY'
          import json,re
          p=re.compile(r'JULES_FINDINGS_JSON_BEGIN\s*(.*?)\s*JULES_FINDINGS_JSON_END',re.S)
          assert isinstance(json.loads(p.findall('JULES_FINDINGS_JSON_BEGIN [] JULES_FINDINGS_JSON_END')[-1]),list)
          print('parser contract: OK')
          PY

      - name: Collect and reconcile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          INPUT_SESSION_ID: ${{ inputs.session_id }}
        run: |
          set -euo pipefail
          test -n "$JULES_API_KEY"

          gh label create jules-queued --repo "${{ github.repository }}" --color fbca04 --description "Waiting for Jules concurrency slot" 2>/dev/null || true

          echo "Using shared Jules dispatch guard"

          if [ -x .github/scripts/jules-dispatch-guard.sh ]; then
            if ! .github/scripts/jules-dispatch-guard.sh; then
              echo "Jules capacity reached. Findings must stay queued."
              exit 0
            fi
          fi

          MAX_JULES_SESSIONS=15
          active_sessions=$(juleson sessions list --state QUEUED,RUNNING --json state 2>/dev/null | jq '[.[] | select(.state=="QUEUED" or .state=="RUNNING")] | length' || echo 0)

          echo "Active Jules sessions: $active_sessions/$MAX_JULES_SESSIONS"

          if [ "$active_sessions" -ge "$MAX_JULES_SESSIONS" ]; then
            echo "Jules concurrency limit reached. New findings should be labelled jules-queued."
          fi
