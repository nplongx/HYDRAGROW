name: jules-bug-collector

# Converts Jules detector findings into GitHub issues.
# Jules only analyzes. GitHub Actions owns issue creation.

on:
  workflow_run:
    workflows:
      - "jules-bug-detector"
    types:
      - completed
  workflow_dispatch:
    inputs:
      finding:
        description: "Optional manual Jules_BUG_FINDING output"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  collect:
    name: "Collect Jules bug finding"
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download detector artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: jules-bug-finding
          path: finding
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Load manual finding
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p finding
          printf '%s\n' '${{ inputs.finding }}' > finding/jules-finding.md

      - name: Validate finding
        run: |
          set -euo pipefail
          test -f finding/jules-finding.md
          grep -q "JULES_BUG_FINDING" finding/jules-finding.md

      - name: Skip non-confirmed findings
        id: gate
        run: |
          if grep -q '^status: confirmed' finding/jules-finding.md; then
            echo "confirmed=true" >> "$GITHUB_OUTPUT"
          else
            echo "confirmed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create labels
        if: steps.gate.outputs.confirmed == 'true'
        run: |
          gh label create "jules-detected" \
            --repo "${{ github.repository }}" \
            --color "b60205" \
            --description "Finding reported by Jules detector" \
            2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check duplicates
        if: steps.gate.outputs.confirmed == 'true'
        id: duplicate
        run: |
          TITLE=$(grep '^title:' finding/jules-finding.md | sed 's/^title: *//' || true)
          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label "jules-detected" \
            --search "in:title $TITLE" \
            --json number \
            --jq '.[0].number' || true)
          echo "issue=$EXISTING" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create bug issue
        if: steps.gate.outputs.confirmed == 'true' && steps.duplicate.outputs.issue == ''
        run: |
          TITLE=$(grep '^title:' finding/jules-finding.md | sed 's/^title: *//' || true)
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[Jules Detected Bug] ${TITLE}" \
            --body-file finding/jules-finding.md \
            --label "bug,jules-detected"
        env:
          GH_TOKEN: ${{ github.token }}
