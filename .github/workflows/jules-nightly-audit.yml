name: jules-nightly-audit

# Creates audit issues for Jules audit worker.
# Do not use the native `jules` label. Juleson routing owns dispatch.

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  audit:
    name: "Dispatch nightly audit — ${{ matrix.preset }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - nightly-security-audit
          - flaky-test-quarantine
          - doc-sync-sentinel
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this preset already has an open audit issue
        id: dedup
        run: |
          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label "audit" \
            --search "in:title \"[Jules Audit] ${{ matrix.preset }}\"" \
            --json number -q '.[0].number' || true)
          echo "existing=$EXISTING" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build audit issue body
        if: steps.dedup.outputs.existing == ''
        run: |
          cat > /tmp/audit_body.md << BODY
          ## 🌙 Nightly audit — \`${{ matrix.preset }}\`

          Audit preset generated automatically.

          Findings must use:
          - template: \`jules-finding\`
          - labels: \`audit,finding\`

          Do NOT use \`jules\` label.

          ---
          *Auto-dispatched bởi \`.github/workflows/jules-nightly-audit.yml\` | $(date -u +"%Y-%m-%dT%H:%M:%SZ")*
          BODY

      - name: Create audit issue
        if: steps.dedup.outputs.existing == ''
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[Jules Audit] ${{ matrix.preset }} — $(date -u +%Y-%m-%d)" \
            --body-file /tmp/audit_body.md \
            --label "audit"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
