[build]
# Chỉ định target mặc định là ESP32-C3 (RISC-V)
target = "riscv32imc-esp-espidf"

[target.riscv32imc-esp-espidf]
# Yêu cầu ldproxy để link code Rust với ESP-IDF C
linker = "ldproxy"
rustflags = [
    "--cfg", "espidf_time64",
]

[unstable]
# Khuyên dùng: giúp build nhanh hơn với build-std
build-std = ["std", "panic_abort"]
