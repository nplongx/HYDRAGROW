services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hydragrow
      POSTGRES_USER: hydragrow
      POSTGRES_PASSWORD: dev_only_password
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf"]

  influxdb:
    image: influxdb:2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: hydragrow
      DOCKER_INFLUXDB_INIT_PASSWORD: dev_only_password
      DOCKER_INFLUXDB_INIT_ORG: hydragrow
      DOCKER_INFLUXDB_INIT_BUCKET: sensors
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev_only_token
    ports: ["8086:8086"]
    volumes: ["influx_data:/var/lib/influxdb2"]

  backend:
    build:
      context: .
      dockerfile: hydragrow-backend/Dockerfile
    env_file: ./hydragrow-backend/.env
    depends_on: [postgres, mosquitto, influxdb]
    ports: ["8080:8080"]

volumes:
  pg_data:
  influx_data:
