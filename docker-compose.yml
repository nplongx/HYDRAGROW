services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hydragrow
      POSTGRES_USER: hydragrow
      POSTGRES_PASSWORD: dev_only_password
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf"]

  backend:
    build:
      context: .
      dockerfile: hydragrow-backend/Dockerfile
    env_file: ./hydragrow-backend/.env
    depends_on: [postgres, mosquitto]
    ports: ["8080:8080"]

volumes:
  pg_data:
