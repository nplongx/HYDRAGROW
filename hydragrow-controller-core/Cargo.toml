[package]
name = "hydragrow-controller-core"
version = "0.1.0"
edition = "2024"

[features]
test-support = []

[dependencies]
serde = "1.0.228"
chrono = "0.4"
cron = "0.16.0"
log = "0.4"
tracing = { version = "0.1", features = ["log"] }
hydragrow-shared = { path = "../hydragrow-shared" }
anyhow = "1.0.104"
serde_json = "1.0.151"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
insta = { version = "1.43.2", features = ["json"] }

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
