[package]
name = "hydragrow-shared"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[dev-dependencies]
insta = { version = "1.43.2", features = ["json"] }
